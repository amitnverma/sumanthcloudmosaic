# Paste into CloudPanel → Sites → cloudmosaic.ai → Vhost / Nginx → Additional Nginx Directives
# Then Save and reload nginx. Affects /time PHP only.
# PHP-FPM pool for this site: 127.0.0.1:20003

location ~ ^/time/.*\.php$ {
    root /home/cloudmosaicai/htdocs/cloudmosaic.ai;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass 127.0.0.1:20003;
    fastcgi_read_timeout 60s;
}
